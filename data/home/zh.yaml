sections:
  - hero
  - type: cards
    key: chapters
  - type: markdown
    key: status
  - cta

hero:
  eyebrow: 教程主题 · 中心化交易所线性永续合约
  title_lines:
    - 一笔委托
    - 如何走完全程？
  desc: 以一笔 BTC-USDT 线性永续委托为主线，讲清规格校验、订单接入、撮合、账本、保证金、强平与故障恢复。
  note: 以公开产品规则与 API 为外部依据；交易所未公开的内部架构均标注为教学参考设计。
  actions:
    - label: 从第 1 章开始
      url: book/ch01-contract-spec/
      icon: fa-solid fa-book-open
      style: primary
    - label: 查看课程路线
      url: roadmap/
      icon: fa-solid fa-route
      style: ghost

chapters:
  eyebrow: v1.0 定稿 · 全部 11 章
  title: 从这里开始逐章阅读
  desc: 每章从具体问题出发，沿着递进算例与系统图推导关键不变量，附实验、渐进提示、参考解答和重建练习。
  columns: 3
  link_label: 阅读章节
  items:
    - { title: 第 1 章 · 合约规格, desc: 从交易单位与精度出发，建立订单校验的共同语言。, url: book/ch01-contract-spec/, icon: fa-solid fa-ruler-combined }
    - { title: 第 2 章 · 订单接入, desc: 从请求校验、幂等键和状态转换开始。, url: book/ch02-order-acceptance/, icon: fa-solid fa-inbox }
    - { title: 第 3 章 · 订单簿, desc: 推导价格优先、时间优先和撮合边界。, url: book/ch03-order-book/, icon: fa-solid fa-list }
    - { title: 第 4 章 · 账本与持仓, desc: 让成交可靠地转化为资产、余额与仓位变化。, url: book/ch04-ledger-position/, icon: fa-solid fa-book }
    - { title: 第 5 章 · 保证金与风险, desc: 把已有仓位、活动挂单和可用额度一起计算。, url: book/ch05-margin-risk/, icon: fa-solid fa-scale-balanced }
    - { title: 第 6 章 · 价格与资金费, desc: 区分最新价、指数价、标记价及资金费结算。, url: book/ch06-prices-funding/, icon: fa-solid fa-chart-line }
    - { title: 第 7 章 · 强平, desc: 从风险触发推到减仓、破产价与缺口处置。, url: book/ch07-liquidation/, icon: fa-solid fa-shield-halved }
    - { title: 第 8 章 · 故障恢复, desc: 通过日志、快照和重放恢复一致状态。, url: book/ch08-recovery/, icon: fa-solid fa-rotate }
    - { title: 第 9 章 · 实时推送, desc: 用序列号、确认游标和快照重同步连接状态。, url: book/ch09-streaming/, icon: fa-solid fa-tower-broadcast }
    - { title: 第 10 章 · 容量与运营, desc: 用队列算例推导限流、过载拒绝、降级和正确性监控。, url: book/ch10-capacity-operations/, icon: fa-solid fa-gauge-high }
    - { title: 第 11 章 · 端到端重建, desc: 从同一笔委托串起撮合、账本、风控、恢复与容量保护。, url: book/ch11-end-to-end-reconstruction/, icon: fa-solid fa-diagram-project }

status:
  eyebrow: 编写进度
  title: 全书 v1.0 已定稿
  body: |
    **v1.0 · 2026-10-05。** 11 章正文、图示、实验与参考解答已完成本版审校；术语表提供专业名称、缩写和接口字段的英文对应。

    完整目录见[课程路线](roadmap/)，范围与检查结果见[定稿说明](docs/release/)。

cta:
  title: 想先看系统如何逐步演化？
  desc: 打开演进地图，查看每个抽象如何从前一个问题中长出来。
  label: 查看演进地图
  url: docs/evolution-map/
  style: primary
  icon: fa-solid fa-arrow-right
