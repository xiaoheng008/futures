title: 数字资产永续合约交易系统
baseURL: https://xiaoheng008.github.io/futures/
defaultContentLanguage: zh
enableGitInfo: true
enableRobotsTXT: true
timeZone: UTC

languages:
  zh:
    locale: zh-CN
    title: 数字资产永续合约交易系统
    weight: 1
    hasCJKLanguage: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.165.0

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"]]

params:
  description: 从一笔委托推导中心化交易所永续合约的撮合、账本、风险与恢复核心链路
  offline_search: true
  ui:
    docs_section: docs
    pager_types: [docs, book]
    shell_types: [docs, book]
    book_draft_banner: true
